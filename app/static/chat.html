<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Document SaaS - Chatbot</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-chat: #0b1120;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --user-bubble: #2563eb;
      --assistant-bubble: #1e293b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: 280px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-color); }
    .new-chat-btn {
      width: 100%;
      padding: 10px 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .new-chat-btn:hover { background: var(--primary-hover); }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .conv-item {
      padding: 10px 12px;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      transition: all 0.15s;
    }
    .conv-item:hover { background: #334155; color: var(--text-main); }
    .conv-item.active { background: #334155; color: var(--text-main); font-weight: 500; }
    .conv-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 8px;
    }
    .conv-actions { display: none; gap: 4px; }
    .conv-item:hover .conv-actions, .conv-item.active .conv-actions { display: flex; }
    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 12px;
    }
    .icon-btn:hover { color: var(--text-main); background: #475569; }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Main Chat Area */
    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-chat);
      height: 100vh;
      position: relative;
    }

    #chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-dark);
    }
    .header-title { font-size: 16px; font-weight: 600; }
    .auth-status { font-size: 13px; color: var(--text-muted); display: flex; gap: 10px; align-items: center; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-row { display: flex; width: 100%; max-width: 840px; margin: 0 auto; gap: 12px; }
    .message-row.user { justify-content: flex-end; }
    .message-row.assistant { justify-content: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .avatar.user-avatar { background: #3b82f6; color: white; }
    .avatar.ai-avatar { background: #10b981; color: white; }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 75%;
      line-height: 1.5;
      font-size: 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .bubble.user-bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 2px; }
    .bubble.assistant-bubble { background: var(--assistant-bubble); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }

    .meta-tokens { font-size: 11px; color: #64748b; margin-top: 6px; }

    /* Empty state */
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      max-width: 400px;
    }
    .empty-state h3 { color: var(--text-main); margin-bottom: 8px; font-size: 18px; }

    /* Loading indicator */
    .typing-indicator {
      display: inline-flex;
      gap: 4px;
      padding: 12px 16px;
      background: var(--assistant-bubble);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      align-items: center;
      width: fit-content;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    /* Input Footer */
    #input-footer {
      padding: 16px 20px;
      background: var(--bg-dark);
      border-top: 1px solid var(--border-color);
    }
    .input-box {
      max-width: 840px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14px;
      resize: none;
      height: 48px;
      max-height: 160px;
      line-height: 1.4;
    }
    .send-btn {
      padding: 8px 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .send-btn:disabled { background: #475569; cursor: not-allowed; }

    /* Error Banner */
    #error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 10px 16px;
      border-radius: 6px;
      margin: 10px auto;
      max-width: 840px;
      font-size: 13px;
    }

    /* Modal for Auth */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 12px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-content input {
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="startNewConversation()">
        <span>+</span> New Conversation
      </button>
    </div>
    <div class="conversation-list" id="conv-list">
      <!-- Injected dynamically -->
    </div>
    <div class="sidebar-footer">
      <span id="user-display">Not logged in</span>
      <button class="icon-btn" onclick="openAuthModal()">Login</button>
    </div>
  </aside>

  <!-- Chat Container -->
  <main id="chat-container">
    <header id="chat-header">
      <div class="header-title" id="chat-title">New conversation</div>
      <div class="auth-status">
        <span id="model-badge" style="background:#1e293b; padding:4px 8px; border-radius:4px; font-size:12px; border:1px solid #334155;">Model: Configured</span>
      </div>
    </header>

    <div id="error-banner"></div>

    <div id="messages">
      <div class="empty-state">
        <h3>How can I assist you today?</h3>
        <p>Ask a question, start a draft, or explore ideas with the AI assistant.</p>
      </div>
    </div>

    <footer id="input-footer">
      <div class="input-box">
        <textarea id="message-input" placeholder="Type a message (Enter to send, Shift+Enter for new line)..."></textarea>
        <button id="send-button" class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </footer>
  </main>

  <!-- Login Modal -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <h3 style="margin-bottom:4px;">Login to Chat</h3>
      <p style="font-size:12px; color:var(--text-muted);">Enter your credentials or token</p>
      <input type="text" id="auth-username" placeholder="Email or Username" />
      <input type="password" id="auth-password" placeholder="Password" />
      <button class="new-chat-btn" onclick="login()">Log In</button>
      <div style="text-align:center; font-size:12px; color:var(--text-muted); margin:4px 0;">OR Paste Existing Bearer Token</div>
      <input type="text" id="auth-token" placeholder="Bearer Token" />
      <button class="new-chat-btn" style="background:#475569;" onclick="saveDirectToken()">Save Token</button>
    </div>
  </div>

  <script>
    let currentConversationId = null;
    let isGenerating = false;

    function getAuthHeaders() {
      const token = localStorage.getItem("token");
      return token ? { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" } : { "Content-Type": "application/json" };
    }

    function checkAuth() {
      const token = localStorage.getItem("token");
      if (!token) {
        openAuthModal();
      } else {
        document.getElementById("user-display").innerText = "Authenticated";
        loadConversations();
      }
    }

    function openAuthModal() {
      document.getElementById("auth-modal").style.display = "flex";
    }

    function closeAuthModal() {
      document.getElementById("auth-modal").style.display = "none";
    }

    async function login() {
      const username = document.getElementById("auth-username").value;
      const password = document.getElementById("auth-password").value;
      const formData = new URLSearchParams();
      formData.append("username", username);
      formData.append("password", password);

      try {
        const resp = await fetch("/api/v1/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData
        });
        if (!resp.ok) throw new Error("Authentication failed");
        const data = await resp.json();
        localStorage.setItem("token", data.access_token);
        closeAuthModal();
        document.getElementById("user-display").innerText = "Authenticated";
        loadConversations();
      } catch (err) {
        showError(err.message);
      }
    }

    function saveDirectToken() {
      const token = document.getElementById("auth-token").value.trim();
      if (token) {
        localStorage.setItem("token", token);
        closeAuthModal();
        document.getElementById("user-display").innerText = "Authenticated";
        loadConversations();
      }
    }

    function showError(msg) {
      const banner = document.getElementById("error-banner");
      banner.innerText = msg;
      banner.style.display = "block";
      setTimeout(() => banner.style.display = "none", 5000);
    }

    async function loadConversations() {
      try {
        const resp = await fetch("/api/v1/chat/conversations?page=1&page_size=30", { headers: getAuthHeaders() });
        if (resp.status === 401) return openAuthModal();
        if (!resp.ok) throw new Error("Failed to load history");
        const data = await resp.json();
        renderConversationList(data.conversations);
      } catch (err) {
        showError(err.message);
      }
    }

    function renderConversationList(conversations) {
      const list = document.getElementById("conv-list");
      list.innerHTML = "";
      if (!conversations.length) {
        list.innerHTML = `<div style="padding:12px; font-size:12px; color:var(--text-muted);">No conversations yet</div>`;
        return;
      }
      conversations.forEach(c => {
        const item = document.createElement("div");
        item.className = `conv-item ${c.id === currentConversationId ? "active" : ""}`;
        item.innerHTML = `
          <div class="conv-title" onclick="openConversation(${c.id})">${escapeHtml(c.title)}</div>
          <div class="conv-actions">
            <button class="icon-btn" onclick="renameConv(${c.id}, event)" title="Rename">✎</button>
            <button class="icon-btn" onclick="deleteConv(${c.id}, event)" title="Delete">🗑</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    async function startNewConversation() {
      currentConversationId = null;
      document.getElementById("chat-title").innerText = "New conversation";
      document.getElementById("messages").innerHTML = `
        <div class="empty-state">
          <h3>How can I assist you today?</h3>
          <p>Ask a question, start a draft, or explore ideas with the AI assistant.</p>
        </div>
      `;
      loadConversations();
    }

    async function openConversation(id) {
      currentConversationId = id;
      try {
        const resp = await fetch(`/api/v1/chat/conversations/${id}`, { headers: getAuthHeaders() });
        if (!resp.ok) throw new Error("Failed to fetch conversation");
        const data = await resp.json();
        document.getElementById("chat-title").innerText = data.title;
        renderMessages(data.messages);
        loadConversations();
      } catch (err) {
        showError(err.message);
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById("messages");
      container.innerHTML = "";
      if (!messages || !messages.length) {
        container.innerHTML = `<div class="empty-state"><h3>New conversation</h3><p>Send a message to begin.</p></div>`;
        return;
      }
      messages.forEach(m => appendMessageToUI(m.role, m.content, m.model, m.total_tokens));
      container.scrollTop = container.scrollHeight;
    }

    function appendMessageToUI(role, content, model, tokens) {
      const container = document.getElementById("messages");
      const isUser = role === "user";
      const row = document.createElement("div");
      row.className = `message-row ${isUser ? "user" : "assistant"}`;

      let metaHtml = "";
      if (!isUser && (model || tokens)) {
        metaHtml = `<div class="meta-tokens">${model || ""} ${tokens ? `• ${tokens} tokens` : ""}</div>`;
      }

      row.innerHTML = isUser
        ? `<div class="bubble user-bubble">${escapeHtml(content)}</div><div class="avatar user-avatar">U</div>`
        : `<div class="avatar ai-avatar">AI</div><div class="bubble assistant-bubble">${escapeHtml(content)}${metaHtml}</div>`;

      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      if (isGenerating) return;
      const input = document.getElementById("message-input");
      const content = input.value.trim();
      if (!content) return;

      // Empty state clear
      const empty = document.querySelector(".empty-state");
      if (empty) empty.remove();

      appendMessageToUI("user", content);
      input.value = "";
      setGenerating(true);

      // Append typing indicator
      const typing = document.createElement("div");
      typing.id = "typing-row";
      typing.className = "message-row assistant";
      typing.innerHTML = `<div class="avatar ai-avatar">AI</div><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      document.getElementById("messages").appendChild(typing);
      document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;

      try {
        let resp;
        if (!currentConversationId) {
          // Create conversation with initial message
          resp = await fetch("/api/v1/chat/conversations", {
            method: "POST",
            headers: getAuthHeaders(),
            body: JSON.stringify({ initial_message: content })
          });
          const conv = await resp.json();
          if (!resp.ok) throw new Error(conv.detail || "Error starting conversation");
          currentConversationId = conv.id;
          document.getElementById("chat-title").innerText = conv.title;
          typing.remove();
          if (conv.messages && conv.messages.length > 1) {
            const aiMsg = conv.messages[1];
            appendMessageToUI("assistant", aiMsg.content, aiMsg.model, aiMsg.total_tokens);
          }
        } else {
          // Send message to existing conversation
          resp = await fetch(`/api/v1/chat/conversations/${currentConversationId}/messages`, {
            method: "POST",
            headers: getAuthHeaders(),
            body: JSON.stringify({ content: content })
          });
          const exchange = await resp.json();
          typing.remove();
          if (!resp.ok) throw new Error(exchange.detail || "Error sending message");
          appendMessageToUI("assistant", exchange.assistant_message.content, exchange.assistant_message.model, exchange.assistant_message.total_tokens);
        }
        loadConversations();
      } catch (err) {
        if (typing) typing.remove();
        showError(err.message);
      } finally {
        setGenerating(false);
      }
    }

    function setGenerating(state) {
      isGenerating = state;
      document.getElementById("send-button").disabled = state;
      document.getElementById("message-input").disabled = state;
    }

    async function renameConv(id, event) {
      event.stopPropagation();
      const newTitle = prompt("Enter new title for conversation:");
      if (!newTitle || !newTitle.trim()) return;
      try {
        const resp = await fetch(`/api/v1/chat/conversations/${id}`, {
          method: "PATCH",
          headers: getAuthHeaders(),
          body: JSON.stringify({ title: newTitle.trim() })
        });
        if (!resp.ok) throw new Error("Failed to rename");
        if (id === currentConversationId) document.getElementById("chat-title").innerText = newTitle.trim();
        loadConversations();
      } catch (err) {
        showError(err.message);
      }
    }

    async function deleteConv(id, event) {
      event.stopPropagation();
      if (!confirm("Are you sure you want to delete this conversation?")) return;
      try {
        const resp = await fetch(`/api/v1/chat/conversations/${id}`, {
          method: "DELETE",
          headers: getAuthHeaders()
        });
        if (!resp.ok) throw new Error("Failed to delete");
        if (id === currentConversationId) startNewConversation();
        loadConversations();
      } catch (err) {
        showError(err.message);
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    document.getElementById("message-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    checkAuth();
  </script>
</body>
</html>
