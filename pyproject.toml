[project]
name = "ai-document-saas-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.111",
    "celery>=5.6.3",
    "docx2txt>=0.9",
    "email-validator>=2.3.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.0",
    "passlib>=1.7.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "ruff>=0.16.10",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
